<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background circle with dark fill and glowing gradient border -->
  <circle cx="16" cy="16" r="14" fill="#030712" stroke="url(#glowGrad)" stroke-width="2" />
  <!-- Stylized monogram combining "H" and code tag brackets: < H > -->
  <!-- Left bracket `<` -->
  <path d="M11 12l-3 4 3 4" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Right bracket `>` -->
  <path d="M21 12l3 4-3 4" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Letter H center parts -->
  <path d="M13 11v10M19 11v10M13 16h6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
